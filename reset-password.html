<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Choose a new password for your Inkwell account.">
  <meta name="theme-color" content="#050713">
  <title>Reset password · Inkwell</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="javaScript/Auth/supabaseClient.js" defer></script>
  <script src="javaScript/Auth/reset-password.js" defer></script>
</head>
<body class="auth-site auth-reset-site">
  <nav class="auth-nav" aria-label="Password reset navigation">
    <a class="auth-logo" href="index.html" aria-label="Inkwell home">
      <span class="auth-logo-icon" aria-hidden="true"><i class="ti ti-book-2"></i></span>
      <span class="auth-logo-text">Inkwell</span>
    </a>
    <a class="auth-back-link" href="auth.html?mode=login">
      <i class="ti ti-arrow-left" aria-hidden="true"></i>
      <span>Back to login</span>
    </a>
  </nav>

  <main class="auth-reset-main">
    <section class="auth-reset-card" aria-labelledby="reset-title">
      <p class="auth-view-kicker">SECURE YOUR ACCOUNT</p>
      <h1 id="reset-title">Choose a new password.</h1>
      <p class="auth-reset-copy">Use at least eight characters. A longer, unique password is stronger.</p>

      <form class="auth-form" id="reset-password-form" novalidate>
        <div class="auth-field">
          <label for="reset-password">New password</label>
          <div class="auth-input-shell">
            <i class="ti ti-lock" aria-hidden="true"></i>
            <input
              id="reset-password"
              name="password"
              type="password"
              autocomplete="new-password"
              minlength="8"
              aria-describedby="reset-password-error"
              required
            >
            <button class="auth-password-toggle" type="button" data-password-toggle="reset-password" aria-label="Show password" aria-controls="reset-password" aria-pressed="false">
              <i class="ti ti-eye" aria-hidden="true"></i>
            </button>
          </div>
          <p class="auth-field-message" id="reset-password-error" aria-live="polite"></p>
        </div>

        <div class="auth-field">
          <label for="reset-password-confirm">Confirm new password</label>
          <div class="auth-input-shell">
            <i class="ti ti-lock-check" aria-hidden="true"></i>
            <input
              id="reset-password-confirm"
              name="passwordConfirm"
              type="password"
              autocomplete="new-password"
              minlength="8"
              aria-describedby="reset-password-confirm-error"
              required
            >
            <button class="auth-password-toggle" type="button" data-password-toggle="reset-password-confirm" aria-label="Show password" aria-controls="reset-password-confirm" aria-pressed="false">
              <i class="ti ti-eye" aria-hidden="true"></i>
            </button>
          </div>
          <p class="auth-field-message" id="reset-password-confirm-error" aria-live="polite"></p>
        </div>

        <button class="auth-primary-action" type="submit" disabled data-reset-submit>
          <span data-submit-label>Update password</span>
          <i class="ti ti-arrow-right" aria-hidden="true"></i>
        </button>

        <p class="auth-form-status" data-form-status role="status" aria-live="polite">Checking your recovery link…</p>
      </form>
    </section>
  </main>
</body>
</html>
